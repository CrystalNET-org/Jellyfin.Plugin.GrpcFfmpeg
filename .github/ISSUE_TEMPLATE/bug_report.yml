name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please run **Save and test connection** on the plugin's settings page
        first: it shows connection problems, directories the workers do not share, and version
        mismatches. Problems with the workers themselves belong to
        [grpc-ffmpeg](https://github.com/CrystalNET-org/grpc-ffmpeg/issues).
        Security problems: please report them privately, see [SECURITY.md](https://github.com/CrystalNET-org/Jellyfin.Plugin.GrpcFfmpeg/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown under Dashboard → Plugins
    validations:
      required: true
  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin version and installation
      description: e.g. 12.1, official Docker image
    validations:
      required: true
  - type: input
    id: worker-version
    attributes:
      label: Worker image
      description: e.g. ghcr.io/crystalnet-org/ffmpeg-worker:8.1.3-7.8
    validations:
      required: true
  - type: textarea
    id: test-result
    attributes:
      label: Result of "Save and test connection"
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Console and logs
      description: |
        The relevant lines from the plugin's console, and from Jellyfin's log (search for `gRPC-ffmpeg`).
        Remove tokens and other secrets before posting.
      render: text
