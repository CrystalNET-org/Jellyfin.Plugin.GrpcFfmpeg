# Tag as <major>.<minor>.<patch> (e.g. 0.2.0) to build, release and list a new version
when:
  - event: tag

steps:
  - name: package
    image: mcr.microsoft.com/dotnet/sdk:9.0
    environment:
      TARGET_ABI: "10.11.0.0"
    commands:
      - apt-get update && apt-get install -y --no-install-recommends zip
      - VERSION="$${CI_COMMIT_TAG#v}.0"
      - dotnet build -c Release -p:Version=$VERSION Jellyfin.Plugin.GrpcFfmpeg/Jellyfin.Plugin.GrpcFfmpeg.csproj
      - mkdir -p artifacts/package
      - cp Jellyfin.Plugin.GrpcFfmpeg/bin/Release/net9.0/Jellyfin.Plugin.GrpcFfmpeg.dll artifacts/package/
      - TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      - >-
        printf '{"guid":"5fce29c6-1366-41cd-9b05-6447a531b590","name":"gRPC-ffmpeg","description":"Runs Jellyfin'"'"'s ffmpeg commands on remote grpc-ffmpeg workers.","overview":"","owner":"CrystalNET-org","category":"General","version":"%s","targetAbi":"%s","timestamp":"%s","changelog":"","status":"Active","autoUpdate":true,"assemblies":[]}\n'
        "$VERSION" "$TARGET_ABI" "$TIMESTAMP" > artifacts/package/meta.json
      - cd artifacts/package && zip -j ../gRPC-ffmpeg_$VERSION.zip ./* && cd ../..
      - md5sum artifacts/gRPC-ffmpeg_$VERSION.zip | cut -d' ' -f1 > artifacts/checksum
      - printf '%s\n%s\n' "$VERSION" "$TIMESTAMP" > artifacts/release-info
      - ls -l artifacts

  - name: publish-release
    image: woodpeckerci/plugin-release:0.3.2
    settings:
      files:
        - artifacts/*.zip
      api_key:
        from_secret: GITHUB_TOKEN
      note: "Automated release by Woodpecker CI for $${CI_COMMIT_TAG}"

  - name: update-manifest
    image: python:3.13-slim
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
      TARGET_ABI: "10.11.0.0"
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - VERSION=$(sed -n 1p artifacts/release-info)
      - TIMESTAMP=$(sed -n 2p artifacts/release-info)
      # Changelog for the plugin catalog: commit titles since the previous release
      - git fetch --tags --force --unshallow origin || git fetch --tags --force origin
      - PREVIOUS=$(git describe --tags --abbrev=0 "$${CI_COMMIT_TAG}^" 2>/dev/null || true)
      - >-
        if [ -n "$PREVIOUS" ]; then
        CHANGELOG=$(git log --no-merges --pretty='- %s' "$PREVIOUS..$${CI_COMMIT_TAG}" | grep -v '^- manifest: ' || true);
        else CHANGELOG="Initial release"; fi
      - git fetch origin main && git checkout -B main origin/main
      - >-
        python3 scripts/update_manifest.py --version "$VERSION" --target-abi "$TARGET_ABI"
        --url "https://github.com/$${CI_REPO}/releases/download/$${CI_COMMIT_TAG}/gRPC-ffmpeg_$VERSION.zip"
        --checksum "$(cat artifacts/checksum)" --timestamp "$TIMESTAMP" --changelog "$CHANGELOG"
      - 'git -c user.name="Woodpecker CI" -c user.email="woodpecker-bot@crystalnet.org" commit -am "manifest: add $VERSION"'
      - git push "https://x-access-token:$${GITHUB_TOKEN}@github.com/$${CI_REPO}.git" main
