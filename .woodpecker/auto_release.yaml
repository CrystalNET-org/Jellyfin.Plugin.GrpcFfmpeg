# Tags a patch release when a push to main changes the embedded grpc-ffmpeg
# release or the Jellyfin packages (e.g. an automerged Renovate update), see
# scripts/next-release-tag.sh. The release pipeline then publishes the plugin
# and adds it to manifest.json.
# Only tag once the build and the integration test (in real Jellyfin images)
# of this commit succeeded; a failure skips the tag. The tag can be pushed by
# hand after fixing it.
depends_on:
  - build
  - integration

when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path: Jellyfin.Plugin.GrpcFfmpeg/Jellyfin.Plugin.GrpcFfmpeg.csproj

steps:
  - name: tag-release
    image: harbor.crystalnet.org/dockerhub-proxy/alpine/git:v2.54.0
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - git fetch --tags --force origin
      - TAG=$(sh scripts/next-release-tag.sh)
      - if [ -z "$TAG" ]; then echo "No dependency change since the last release, nothing to tag"; exit 0; fi
      - echo "Tagging $${CI_COMMIT_SHA} as $TAG"
      - git tag "$TAG" "$${CI_COMMIT_SHA}"
      - git push "https://x-access-token:$${GITHUB_TOKEN}@github.com/$${CI_REPO}.git" "refs/tags/$TAG"
